name: NEPENTHES trace hook

on:
  push:
    paths:
      - "nepenthes/**"
      - "tandem.patch"
      - "build.sh"
      - ".github/workflows/nepenthes-trace.yml"
  pull_request:
    paths:
      - "nepenthes/**"
      - "tandem.patch"
      - "build.sh"
      - ".github/workflows/nepenthes-trace.yml"

jobs:
  trace-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++17 trace smoke test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Inepenthes nepenthes/test_nepenthes_trace.cpp \
            -o /tmp/nepenthes-trace-test
      - name: Run trace smoke test
        run: /tmp/nepenthes-trace-test
      - name: Compile and run JSONL sink test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Inepenthes nepenthes/test_nepenthes_jsonl_sink.cpp \
            -o /tmp/nepenthes-jsonl-test
          /tmp/nepenthes-jsonl-test
      - name: Verify runtime patches apply to pinned llama.cpp base
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp fetch --depth=1 origin f5222f25c18da062ab2b8a2dbbfbf4feae398566
          git -C /tmp/llama.cpp checkout -q FETCH_HEAD
          git -C /tmp/llama.cpp apply --check "$GITHUB_WORKSPACE/tandem.patch"
          git -C /tmp/llama.cpp apply "$GITHUB_WORKSPACE/tandem.patch"
          git -C /tmp/llama.cpp apply --check "$GITHUB_WORKSPACE/nepenthes/runtime.patch"
          git -C /tmp/llama.cpp apply "$GITHUB_WORKSPACE/nepenthes/runtime.patch"
          grep -n -B3 -A4 'n_expert_used(model.hparams.n_expert_used_max())' /tmp/llama.cpp/src/llama-moe-cache.cpp
          grep -n -B2 -A3 'std::thread worker;' /tmp/llama.cpp/src/llama-moe-cache.cpp
          grep -n -B4 -A8 'void la_loop()' /tmp/llama.cpp/src/llama-moe-cache.cpp
          grep -n -B2 -A6 'la_job.load' /tmp/llama.cpp/src/llama-moe-cache.cpp
          git -C /tmp/llama.cpp apply --check "$GITHUB_WORKSPACE/nepenthes/runtime-sink.patch"
          git -C /tmp/llama.cpp apply "$GITHUB_WORKSPACE/nepenthes/runtime-sink.patch"
          cat > /tmp/nepenthes-runtime-smoke.cpp <<'EOF'
          #include "nepenthes_jsonl_sink.hpp"
          int main() {
              nepenthes::JsonlSink sink("/tmp/nepenthes-runtime-smoke.jsonl", "ci");
              nepenthes::emit(nepenthes::EventType::cache_hit, "runtime-header", 1, 2);
              sink.close();
              return 0;
          }
          EOF
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I/tmp/llama.cpp/src /tmp/nepenthes-runtime-smoke.cpp \
            -o /tmp/nepenthes-runtime-trace-test
          /tmp/nepenthes-runtime-trace-test
