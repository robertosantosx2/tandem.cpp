name: NEPENTHES sink and runtime patch
on:
  push:
    branches: [nepenthes/active-leones-sink-20261114]
  pull_request:
    branches: [main]
    paths:
      - "nepenthes/**"
      - ".github/workflows/nepenthes-sink.yml"
  workflow_dispatch:
jobs:
  cpp17-sink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile bounded asynchronous sink
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread \
            -Inepenthes nepenthes/test_jsonl_sink.cpp -o /tmp/nepenthes-sink-test
      - name: Exercise JSONL writer
        run: /tmp/nepenthes-sink-test
      - name: Validate runtime probe patch against pinned llama.cpp base
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout f5222f25c18da062ab2b8a2dbbfbf4feae398566
          git -C /tmp/llama.cpp apply --check "$GITHUB_WORKSPACE/tandem.patch"
          git -C /tmp/llama.cpp apply "$GITHUB_WORKSPACE/tandem.patch"
          git -C /tmp/llama.cpp apply --check "$GITHUB_WORKSPACE/nepenthes/0001-runtime-worker-prefetch.patch"
